# Q. What is this file?
# A. This file contains options which allow you to configure your multiworld experience while allowing
#    others to play how they want as well.
#
# Q. How do I use it?
# A. Set relative weights for each choice; 0 disables a choice. Edit numeric keys to change values.
#    random/random-low/random-high roll within the range; random-range-X-Y limits the range.
#    Goal and inventory lists stay unweighted. See https://archipelago.gg/tutorial/Archipelago/setup/en

# Your name in-game, limited to 16 characters.
name: Joker

# Used to describe your yaml. Useful if you have multiple files.
description: Default Persona 5 Royal Template

game: Persona 5 Royal (luigiarc)
requires:
  version: 0.6.7 # Version of Archipelago required for this yaml to work as expected.

Persona 5 Royal (luigiarc):
  ################
  # Game Options #
  ################

  # A system that can move progression earlier, to try and prevent the player from getting stuck
  # and bored early.
  #
  # A lower setting means more getting stuck. A higher setting means less getting stuck.
  # Minimum value is 0, maximum value is 99.
  progression_balancing:
    50: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-99: 0

  # Set rules for reachability of your items/locations.
  #
  # full: ensure everything can be reached and acquired.
  # minimal: ensure what is needed to reach your goal can be acquired.
  accessibility:
    full: 50
    minimal: 0

  # Which Palace clears are required to goal. Multiple are allowed and if multiple are specified, all must be cleared to goal
  # Clear is sent after the respective boss is defeated.
  #
  # Valid palaces: kamoshida, madarame, kaneshiro, futaba, okumura, niijima, shido, maruki (has issues)
  goal_palaces:
    - shido

  # Require registering every tracked Persona. This can also be combined with Palace goals.
  goal_compendium:
    "false": 50
    "true": 0

  # Add 232 Persona registration checks.
  compendium_sanity:
    "false": 50
    "true": 0

  # Range 0–500. Shop checks unlock across the eight Palace-access tiers.
  shop_item_count:
    20: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-500: 0
  shop_minimum_price:
    1000: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-9999999: 0
  shop_maximum_price:
    10000: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-9999999: 0

  # Number of chest checks in EACH Mementos Path.
  # Minimum value is 1, maximum value is 20
  mementos_chests_per_path:
    5: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-20: 0

  # Whether Palace access/calling-card permissions come from two shared progressive items (on,
  # default) or from 8 distinct per-Palace items instead (off). Progressive is recommended.
  progressive_palace_access:
    "false": 0
    "true": 50

  # Battle EXP multiplier game-wide.
  xp_multiplier:
    1: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-10: 0

  # Battle money multiplier game-wide, including instakill.
  money_multiplier:
    1: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-10: 0

  # Battle item quantity multiplier, including instakill.
  item_multiplier:
    1: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-1-10: 0

  # Send a DeathLink when the party is wiped.
  death_link:
    "false": 0
    "true": 50

  # Percentage of each active party member's maximum HP removed by a received DeathLink.
  # Damage cannot reduce a living member below 1 HP
  death_link_damage_percent:
    30: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-100: 0

  ###########################
  # Item & Location Options #
  ###########################

  # Counts allow duplicates and must fit available reward slots.
  # Defaults fill 163 inventory slots. (other 68 include progression items, party recruits, party-level rewards to add up to default 231 total locations)

  # 195 items. Example: Rebel Knife. Set to 0 to disable.
  randomize_melee_weapons:
    20: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-20: 0

  # 106 items. Example: Tkachev. Set to 0 to disable.
  randomize_guns:
    15: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-20: 0

  # 200 items. Example: Dark Undershirt. Set to 0 to disable.
  randomize_armor:
    25: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-20: 0

  # 439 items. Example: Hip Glasses. Set to 0 to disable.
  randomize_accessories:
    25: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-20: 0

  # 551 items. Example: Soma. Set to 0 to disable.
  randomize_consumables:
    48: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-20: 0

  # 459 items. Example: Agi. Set to 0 to disable.
  randomize_skill_cards:
    30: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-20: 0

  # 168 items. Example: Gold Coin. Set to 0 to disable.
  randomize_materials:
    0: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-20: 0

  # 273 items. Example: Shujin Uniform. Set to 0 to disable.
  randomize_outfits:
    0: 50
    random: 0
    random-low: 0
    random-high: 0
    random-range-0-20: 0

  # Forces these items to be in their native world.
  local_items: []

  # Forces these items to be outside their native world.
  non_local_items: []

  # Start with the specified amount of these items. Example: {Bomb: 1, Arrow: 3}
  start_inventory: [Perma-Pick]

  # Remove these starting items from the randomized pool and replace their locations with
  # filler.
  start_inventory_from_pool: [Progressive Palace Access, Progressive Mementos Access]

  # Start with these item's locations prefilled into the `!hint` command.
  start_hints: []

  # Start with these locations and their item prefilled into the `!hint` command.
  start_location_hints: []

  # Prevent these locations from having an important item.
  exclude_locations: []

  # Prevent these locations from having an unimportant item.
  priority_locations: []

  # Share part of your item pool with other players.
  item_links: []

  # Generic items plando.
  plando_items: []
